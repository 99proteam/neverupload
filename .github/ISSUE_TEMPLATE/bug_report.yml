name: Bug report
description: Something doesn't work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! **Please don't attach private documents.** If a specific file triggers the bug, try to reproduce it with a file you're happy to share publicly.
  - type: dropdown
    id: tool
    attributes:
      label: Which tool?
      options:
        - Merge PDF
        - Split PDF
        - Compress PDF
        - Rotate & Reorder PDF
        - Images to PDF
        - PDF to Images
        - Compress Image
        - Resize Image
        - Convert Image
        - QR Code Generator
        - Home page / general / offline
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Split PDF
        2. Add a 40-page PDF (12 MB)
        3. Enter "1-3, 5"
        4. ...
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: e.g. Firefox 140 on Windows 11, Safari on iOS 19
    validations:
      required: true
  - type: textarea
    id: console
    attributes:
      label: Errors from the browser console (optional)
      render: text
